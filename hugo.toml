baseURL = "https://www.anaschwendler.com/"
defaultContentLanguage = "en"
title = "Ana Schwendler"
theme = "beautifulhugo"

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  homeTitle = "Ana Schwendler" # Set a different text for the header on the home page
  subtitle = "Senior Backend Engineer"
  mainSections = ["post", "posts"]
  logo = "/img/avatar-icon.jpeg" # Expecting square dimensions
  favicon = "/img/favicon.ico"
  dateFormat = ":date_long"
  commit = false
  rss = true
  readingTime = true
  wordCount = true
  colorScheme = "auto"
  selfHosted = true # serve fonts and libraries from this domain (GDPR)
  socialShare = true
  showRelatedPosts = true

  [params.author]
    name = "Ana Schwendler"
    website = "https://www.anaschwendler.com"
    email = "schwendler@gmail.com"
    github = "anaschwendler"
    gitlab = "anaschwendler"
    bluesky = "anaschwendler.bsky.social"
    linkedin = "anaschwendler"

[languages]
  [languages.en]
    contentDir = "content/en" # English
    label = "English"
    weight = 1
    [[languages.en.menus.main]]
      name = "Blog"
      url = "/"
      weight = 1
    [[languages.en.menus.main]]
      name = "About"
      url = "page/about/"
      weight = 2
    [[languages.en.menus.main]]
      name = "Experiences"
      url = "page/experiences/"
      weight = 3
    [[languages.en.menus.main]]
      name = "Events and Talks"
      url = "page/events/"
      weight = 4
    [[languages.en.menus.footer]]
      name = "Privacy"
      url = "page/privacy/"
      weight = 1

  [languages.br]
    contentDir = "content/br" # Brazilian Portuguese
    label = "Português"
    locale = "pt-BR"
    weight = 2
    [languages.br.params]
      subtitle = "Engenheira de Software Sênior (Backend)"
    [[languages.br.menus.main]]
      name = "Blog"
      url = "/"
      weight = 1
    [[languages.br.menus.main]]
      name = "Sobre"
      url = "page/about/"
      weight = 2
    [[languages.br.menus.main]]
      name = "Experiências"
      url = "page/experiences/"
      weight = 3
    [[languages.br.menus.main]]
      name = "Eventos e Palestras"
      url = "page/events/"
      weight = 4
    [[languages.br.menus.footer]]
      name = "Privacidade"
      url = "page/privacy/"
      weight = 1
